[package]
name = "orlogin"
version = "6.0.0"
edition = "2021"
description = "Encrypted local vault and login helper for Oldschool Ragnarok Online (OSRO)"
license = "MIT"
repository = "https://github.com/torrq/ORLogin"

[features]
default = []
portable = []

[[bin]]
name = "orlogin"
path = "src/main.rs"
test = false

[dependencies]
eframe = "0.29"
egui = "0.29"
resvg = { version = "0.45", default-features = false }
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
